<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finance Forward Decision Lab</title>
<style>
:root{
--bg:#1f0507;--bg2:#2e0a0d;--card:rgba(58,13,18,.72);--card2:#3a0e13;
--fg:#f5eee6;--mut:#c8b3ad;--line:rgba(201,164,107,.22);--soft:rgba(201,164,107,.10);
--gold:#c9a46b;--goldhi:#e0bf86;--goldbg:rgba(201,164,107,.14);
--green:#4fbf8a;--greenbg:rgba(79,191,138,.14);
--bad:#e8705f;--badbg:rgba(232,112,95,.14);
--ink:#140304;--onink:#f5eee6;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font:16px/1.55 Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
background:radial-gradient(900px 500px at 85% -5%,rgba(150,36,44,.35),transparent 60%),radial-gradient(700px 500px at -10% 40%,rgba(120,28,34,.28),transparent 60%),linear-gradient(180deg,var(--bg2) 0%,var(--bg) 60%,#170304 100%);
background-attachment:fixed;padding-bottom:env(safe-area-inset-bottom,0)}
header{padding:calc(env(safe-area-inset-top,0px) + 26px) 16px 24px;border-bottom:1px solid var(--line);background:rgba(20,3,4,.55)}
header>div{max-width:920px;margin:0 auto}
.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--gold);font-size:.78rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.eyebrow:before{content:"";width:28px;height:1px;background:var(--gold)}
header h1{margin:10px 0 6px}
header p{margin:0;color:var(--mut);max-width:620px}
main{max-width:920px;margin:0 auto;padding:22px 16px 56px}
h1,h2,h3{font-family:Archivo,Inter,"Segoe UI",system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0;color:var(--fg)}
h1{font-size:clamp(1.9rem,5vw,2.8rem)}
h2{font-size:1.5rem;margin-bottom:8px}
h3{font-size:1.15rem;margin:26px 0 10px}
.steps{display:flex;gap:6px;margin:0 0 20px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--soft)}
.steps i.done{background:var(--gold)}
.steps i.now{background:var(--goldhi);box-shadow:0 0 12px rgba(224,191,134,.5)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);backdrop-filter:blur(6px)}
.stat b{display:block;font-size:1.5rem;font-family:Archivo,Inter,sans-serif;font-weight:800}
.stat span{font-size:.82rem;color:var(--mut)}
.stat.g b{color:var(--fg)}.stat.y b{color:var(--gold)}.stat.r b{color:var(--bad)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:20px;box-shadow:0 14px 40px rgba(0,0,0,.3)}
.panel p{color:var(--mut);margin:6px 0 0}
.panel.dark{background:linear-gradient(160deg,#4a1217,#2a0709);border-color:rgba(201,164,107,.35)}
.panel.dark p{color:#eadcd6}
.opt{display:block;width:100%;text-align:left;margin:12px 0 0;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(20,3,4,.35);color:var(--fg);font:inherit;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.opt:hover:not(:disabled){background:var(--goldbg);border-color:var(--gold);transform:translateY(-1px)}
.opt:focus-visible,.btn:focus-visible{outline:2px solid var(--goldhi);outline-offset:3px}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt b{display:block;font-weight:700}
.opt small{display:block;color:var(--mut);margin-top:2px}
.btn{padding:12px 24px;border:0;border-radius:999px;background:var(--gold);color:#1f0507;font:inherit;font-weight:700;cursor:pointer;margin-top:16px;transition:background .2s}
.btn:hover{background:var(--goldhi)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:620px}
th,td{padding:9px 12px;border-bottom:1px solid var(--soft);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--gold);font-weight:600;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;background:rgba(20,3,4,.4)}
tr:last-child td{border-bottom:0}
.neg{color:var(--bad);font-weight:600}.pos{color:var(--green);font-weight:600}
.note{border:1px solid var(--line);border-left:3px solid var(--gold);padding:12px 16px;margin:12px 0;background:rgba(20,3,4,.35);border-radius:12px;color:var(--mut)}
.note b{color:var(--fg)}
.warn{color:var(--bad)!important;font-size:.88rem}
.badge{display:inline-block;padding:6px 18px;border-radius:999px;font-family:Archivo,Inter,sans-serif;font-weight:800;font-size:1.2rem;color:#1f0507;background:var(--gold);margin-top:8px}
.badge.Thriving,.badge.Stable{background:var(--green);color:#052415}
.badge.Critical{background:var(--bad);color:#2a0404}
.badge.Vulnerable,.badge.Struggling{background:var(--gold);color:#1f0507}
ul{color:var(--mut)}li{margin:4px 0}li b{color:var(--fg)}
</style>
</head>
<body>
<header><div><span class="eyebrow">Finance Forward Network</span><h1>Decision Lab</h1><p>Harbor &amp; Pine café is losing ground. Make six monthly decisions, then see how the numbers played out.</p></div></header>
<main>
<div class="steps" id="steps" aria-label="Progress"></div>
<div id="app"></div>
</main>
<script>
/* ---------- Model constants (change here to tune the scenario) ---------- */
const BASE_REV=18000, COGS_RATE=0.4, OPEX=9900, START_CASH=6000, START_RES=3000;
const DECLINE=0.98, LOAN_FEE=0.05, MONTHS=7;

/* ---------- Scenario: one decision per month, months 1–6; month 7 is results only ---------- */
const S=[
{t:"Staffing",q:"Revenue has slipped for a third quarter. Labor is your biggest controllable cost.",o:[
 {l:"Keep current staffing",d:"No change."},
 {l:"Cut staff hours",d:"$200 severance now. Saves $288 a month from Month 2, but service slows and sales fall 2%.",exp:200}]},
{t:"Marketing",q:"A new café opened two blocks away. Do you spend to keep customers?",o:[
 {l:"No marketing",d:"Save the cash."},
 {l:"Local ads: $600",d:"About 6% more customers in Months 3 and 4.",exp:600},
 {l:"Neighborhood campaign: $1,500",d:"About 10% more customers in Months 3 to 5.",exp:1500}]},
{t:"Emergency reserve",q:"You hold a $3,000 reserve for emergencies. Cash on the books feels tight.",o:[
 {l:"Keep the reserve untouched",d:"Available cash stays lower, but you stay protected."},
 {l:"Release the reserve: $3,000",d:"Moves $3,000 into available cash. The reserve will be gone if something breaks.",release:3000}]},
{t:"Equipment",q:"A faster espresso machine would cut wait times.",o:[
 {l:"Skip it",d:"Keep the current machine."},
 {l:"Buy the machine: $1,800",d:"About 10% more customers from Month 5 on. It loses $150 of book value each month, but it is an asset you still own.",capex:1800}]},
{t:"Pricing",q:"Margins are thin. Should prices change from next month?",o:[
 {l:"Keep prices",d:"No change."},
 {l:"Raise prices 5%",d:"Each sale earns more, but about 3% fewer items sell."},
 {l:"Discount 5%",d:"About 8% more items sell, but each one earns less."}]},
{t:"Oven repair",q:"The oven fails. It must be fixed this month. The repair costs $2,400.",o:[
 {l:"Pay from available cash",d:"$2,400 now."},
 {l:"Pay from the emergency reserve",d:"$2,400 from the reserve. Only possible if you still have it.",fromRes:true},
 {l:"Split the payment",d:"$1,200 now plus a $60 financing fee, and $1,200 in Month 7.",pay:1260,fee:60,later:1200}]}
];
S[5].o.forEach(o=>o.exp=2400);
S.forEach(s=>s.o.forEach(o=>{o.pay=o.pay!==undefined?o.pay:(o.exp||0)+(o.capex||0)+(o.fee||0)}));

/* ---------- Engine ---------- */
function factors(t,c){
 let vol=Math.pow(DECLINE,t-1),price=1,saving=0,dep=0;
 if(c[0]===1&&t>1){vol*=.98;saving=288}
 if(c[1]===1&&t>=3&&t<=4)vol*=1.06;
 if(c[1]===2&&t>=3&&t<=5)vol*=1.10;
 if(c[3]===1&&t>4){vol*=1.10;dep=150}
 if(c[4]===1&&t>5){price=1.05;vol*=.97}
 if(c[4]===2&&t>5){price=.95;vol*=1.08}
 return{vol,price,saving,dep};
}
function sim(c,n){
 const s={cash:START_CASH,res:START_RES,loan:0,used:false,payable:0,rows:[]};
 for(let t=1;t<=Math.min(n,MONTHS);t++){
  const o=t<=6?S[t-1].o[c[t-1]]:null, before=s.cash+s.res;
  if(o&&o.release){s.res-=o.release;s.cash+=o.release;s.used=true}
  if(o&&o.fromRes){s.res-=o.pay;s.used=true}
  if(o&&o.later)s.payable+=o.later;
  const f=factors(t,c);
  const rev=BASE_REV*f.price*f.vol, cogs=BASE_REV*COGS_RATE*f.vol, gross=rev-cogs;
  const opex=OPEX-f.saving, exp=o?(o.exp||0):0;
  const opProfit=gross-opex-f.dep-exp, fee=o?(o.fee||0):0;
  s.cash+=gross-opex-((o&&!o.fromRes)?o.pay:0)-(t===MONTHS?s.payable:0);
  let loanFee=0;
  if(s.cash<0){
   const take=Math.min(-s.cash,s.res); s.res-=take; s.cash+=take; if(take>0)s.used=true;
   if(s.cash<0){const sh=-s.cash,L=sh/(1-LOAN_FEE);s.loan+=L;loanFee=L-sh;s.cash=0}
  }
  const eqBook=c[3]===1&&t>=4?1800-150*Math.max(0,t-4):0;
  s.rows.push({t,rev,cogs,gross,opex:opex+f.dep+exp,opProfit,net:opProfit-fee-loanFee,flow:s.cash+s.res-before,
   cash:s.cash,res:s.res,total:s.cash+s.res,book:eqBook,loan:s.loan});
 }
 return s;
}
function outcome(s){
 const last=s.rows[s.rows.length-1];
 if(s.loan>0)return["Critical","An emergency loan was needed, so the business ran out of cash."];
 if(s.used)return["Vulnerable","The emergency reserve was used, so one more shock could have been serious."];
 if(last.opProfit<0)return["Struggling","The business still loses money each month, even though cash remains."];
 if(last.opProfit>=1500)return["Thriving","Healthy profit and the reserve is intact."];
 return["Stable","The business makes a profit and the reserve is intact."];
}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
const m=n=>(n<0?"−$":"$")+Math.abs(Math.round(n)).toLocaleString("en-US");
const cl=n=>n<0?"neg":"";
let choices=[];

function draw(){
 const n=choices.length, st=sim(choices,n), last=st.rows[n-1];
 $("steps").innerHTML=Array.from({length:MONTHS},(_,i)=>`<i class="${i<n?"done":i===n?"now":""}" title="Month ${i+1}"></i>`).join("");
 const stats=`<div class="stats">
  <div class="stat g"><b>${m(st.cash)}</b><span>Available cash</span></div>
  <div class="stat y"><b>${m(st.res)}</b><span>Emergency reserve</span></div>
  <div class="stat"><b>${m(st.cash+st.res)}</b><span>Total cash</span></div>
  <div class="stat ${last&&last.opProfit<0?"r":"g"}"><b class="${last?cl(last.opProfit):""}">${last?m(last.opProfit):"—"}</b><span>Last month’s operating profit</span></div></div>`;
 if(n>=6){report(st,stats);return}
 const sc=S[n];
 let h=stats+`<div class="panel"><span class="eyebrow">Month ${n+1} of 6</span><h2 style="margin-top:10px">${sc.t}</h2><p>${sc.q}</p>`;
 sc.o.forEach((o,i)=>{
  const dis=o.pay>st.cash+st.res||(o.fromRes&&o.pay>st.res);
  const why=dis?(o.fromRes&&o.pay>st.res?"You don’t have enough in the reserve.":"Not enough total cash to cover this."):(o.pay>st.cash&&!o.fromRes?"Uses part of your reserve. You will be asked to confirm.":"");
  h+=`<button class="opt" data-i="${i}" ${dis?"disabled":""}><b>${o.l}</b><small>${o.d}</small>${why?`<small class="warn">${why}</small>`:""}</button>`;
 });
 h+="</div>"+(n?history(st):"");
 $("app").innerHTML=h;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.i,st));
}
function pick(i,st){
 const o=S[choices.length].o[i];
 if(!o.fromRes&&o.pay>st.cash&&!confirm("This costs more than your available cash. The shortfall will come from your emergency reserve. Continue?"))return;
 choices.push(i);draw();window.scrollTo({top:0,behavior:"smooth"});
}
function history(st){
 let h=`<h3>Results so far</h3><div class="tw"><table><tr><th>Month</th><th>Revenue</th><th>Gross profit</th><th>Operating profit</th><th>Cash change</th><th>Total cash</th></tr>`;
 st.rows.forEach(r=>h+=`<tr><td>${r.t}</td><td>${m(r.rev)}</td><td>${m(r.gross)}</td><td class="${cl(r.opProfit)}">${m(r.opProfit)}</td><td class="${cl(r.flow)}">${m(r.flow)}</td><td>${m(r.total)}</td></tr>`);
 return h+"</table></div>";
}
function report(st,stats){
 const full=sim(choices,MONTHS), base=sim([0,0,0,0,0,0],MONTHS);
 const [cat,why]=outcome(full), [bcat]=outcome(base), r7=full.rows[6];
 const sum=(s,k)=>s.rows.reduce((a,r)=>a+r[k],0);
 const book=r7.book;
 let h=`<div class="panel dark"><span class="eyebrow">Final report</span><h2 style="margin-top:10px">Month 7 results</h2><span class="badge ${cat}">${cat}</span><p>${why}</p></div>`;
 h+=`<h3>You vs. the no-action baseline</h3><div class="tw"><table><tr><th></th><th>You</th><th>First option every month</th></tr>
 <tr><td>Outcome</td><td>${cat}</td><td>${bcat}</td></tr>
 <tr><td>Month 7 operating profit</td><td class="${cl(r7.opProfit)}">${m(r7.opProfit)}</td><td class="${cl(base.rows[6].opProfit)}">${m(base.rows[6].opProfit)}</td></tr>
 <tr><td>Total net profit, Months 1–7</td><td class="${cl(sum(full,"net"))}">${m(sum(full,"net"))}</td><td>${m(sum(base,"net"))}</td></tr>
 <tr><td>Total cash at end</td><td>${m(r7.total)}</td><td>${m(base.rows[6].total)}</td></tr>
 <tr><td>Emergency reserve left</td><td>${m(r7.res)}</td><td>${m(base.rows[6].res)}</td></tr>
 <tr><td>Equipment book value (asset owned)</td><td>${m(book)}</td><td>${m(0)}</td></tr>
 <tr><td>Emergency loan</td><td>${m(full.loan)}</td><td>${m(base.loan)}</td></tr></table></div>`;
 h+=`<h3>Month by month</h3><div class="tw"><table><tr><th>Month</th><th>Revenue</th><th>COGS</th><th>Gross profit</th><th>Operating profit</th><th>Net profit</th><th>Cash change</th><th>Available</th><th>Reserve</th></tr>`;
 full.rows.forEach(r=>h+=`<tr><td>${r.t}</td><td>${m(r.rev)}</td><td>${m(r.cogs)}</td><td>${m(r.gross)}</td><td class="${cl(r.opProfit)}">${m(r.opProfit)}</td><td class="${cl(r.net)}">${m(r.net)}</td><td class="${cl(r.flow)}">${m(r.flow)}</td><td>${m(r.cash)}</td><td>${m(r.res)}</td></tr>`);
 h+="</table></div><h3>Your decisions</h3><ul>"+S.map((s,i)=>`<li><b>${s.t}:</b> ${s.o[choices[i]].l}</li>`).join("")+"</ul><h3>What to take from this</h3>";
 h+=`<div class="note"><b>Profit is not cash.</b> The oven repair is a Month 6 expense, but a split payment moves part of the cash out in Month 7. Equipment is not an expense when you buy it. It shows up as depreciation over time, while the cash leaves immediately.</div>`;
 h+=`<div class="note"><b>Available cash is not total cash.</b> Money in the reserve is still yours, but spending it removes your safety net.</div>`;
 if(choices[4]===2)h+=`<div class="note"><b>More revenue is not more profit.</b> The discount sold more items, but each item earned less. Cost of goods follows the number of items sold, not the revenue.</div>`;
 if(choices[4]===1)h+=`<div class="note"><b>Price and volume pull in opposite directions.</b> The price rise earned more per item but lost some customers. Gross profit only improves if the extra margin outweighs the lost sales.</div>`;
 h+=`<div class="note"><b>Doing nothing has a cost.</b> Competition removes about 2% of customers every month unless your choices counter it.</div>`;
 h+=`<button class="btn" id="again">Play again</button>`;
 $("steps").innerHTML=Array.from({length:MONTHS},()=>'<i class="done"></i>').join("");
 $("app").innerHTML=stats+h;
 $("again").onclick=()=>{choices=[];draw();window.scrollTo(0,0)};
}
draw();
</script>
</body>
</html>
